services:
  # Backend FastAPI Service
  - type: web
    name: product-spotter-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install uv && uv pip install -r requirements.txt
    startCommand: gunicorn -w 4 -k uvicorn.workers.UvicornWorker app.main:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./data/analyses.db
      - key: GOOGLE_API_KEY
        sync: false # Set this in the Render dashboard
      - key: ENVIRONMENT
        value: production
    disk:
      name: database-storage
      mountPath: /opt/render/project/src/backend/data
      sizeGB: 1

  # Frontend Next.js Service
  - type: web
    name: product-spotter-frontend
    runtime: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: product-spotter-backend
          property: host
